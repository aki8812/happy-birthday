<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <title>彩蛋影片</title>
  <link rel="icon" href="favicon.ico" />
  <style>
    body {
      margin: 0;
      background-color: black;
      overflow: hidden;
    }
    video {
      display: block;
      width: 100%;
      height: 100vh;
      object-fit: cover;
    }
    #home-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      background-color: red;
      color: yellow;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      z-index: 10;
    }
  </style>
</head>
<body>
  <button id="home-btn" onclick="location.href='index.html'">首頁</button>
  <video id="rick-video" src="assets/video.mp4" autoplay playsinline onended="location.href='index.html'"></video>

  <script>
    const video = document.getElementById("rick-video");
    const tryPlay = () => video.play().catch(() => {});
    tryPlay();
    document.addEventListener("click", tryPlay, { once: true });
  </script>
</body>
</html>
